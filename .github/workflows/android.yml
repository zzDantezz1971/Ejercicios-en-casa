name: App Android

# Genera la app Android (Capacitor):
# - siempre: un APK de prueba (se puede instalar a mano en el móvil);
# - si está el secreto ANDROID_KEYSTORE_PASSWORD: el .aab firmado para subir a Google Play.
#   La primera vez se crea la clave de subida y se guarda CIFRADA con esa contraseña en
#   android/upload-key.jks.enc (sin la contraseña no sirve de nada); las siguientes veces se usa esa misma.
# Solo se lanza a mano (Actions → App Android → Run workflow) cuando se va a preparar una versión
# para Google Play; los cambios del día a día se prueban en la web.
on:
  workflow_dispatch:

permissions:
  # para guardar en el repositorio la clave de subida cifrada (solo la primera vez)
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # el Android SDK ya viene instalado en las máquinas ubuntu-latest de GitHub (ANDROID_HOME)
      - run: npm ci
      - run: npm test
      - name: Versión
        # número de versión para Google Play: tiene que crecer en cada versión subida (el número de compilación)
        run: |
          echo "ANDROID_VERSION_NAME=$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      # clave de los códigos de acceso gratis (secreto ACCESS_CODE_SECRET); sin él, los códigos no funcionan
      - run: npm run build:android
        env:
          VITE_ACCESS_SECRET: ${{ secrets.ACCESS_CODE_SECRET }}
      - name: APK de prueba
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Clave de firma
        id: key
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then echo "Sin contraseña de firma: solo APK de prueba."; exit 0; fi
          if [ ${#PASS} -lt 16 ]; then echo "::error::La contraseña de firma debe tener al menos 16 caracteres."; exit 1; fi
          KS="$RUNNER_TEMP/upload.jks"
          ENC=android/upload-key.jks.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS" -pass env:PASS
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Exercicis a casa"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -out "$ENC" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "App Android: clave de subida a Google Play (cifrada)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          keytool -list -keystore "$KS" -storepass "$PASS" -alias upload > /dev/null
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: App firmada para Google Play (.aab)
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-prueba-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
